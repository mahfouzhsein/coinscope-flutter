name: Publish Android demo

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Release tag, for example v1.0.0
        required: true
        default: v1.0.0

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify project
        run: |
          flutter analyze
          flutter test

      - name: Build Android demo
        run: flutter build apk --release

      - name: Prepare release asset
        run: cp build/app/outputs/flutter-apk/app-release.apk CoinScope-Android.apk

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" CoinScope-Android.apk
          --target "$GITHUB_SHA"
          --title "CoinScope $RELEASE_TAG"
          --generate-notes
