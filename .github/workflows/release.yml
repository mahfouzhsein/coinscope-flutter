name: Publish versioned demo

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Release tag, for example v1.0.0
        required: true
        default: v1.0.0

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify project
        run: |
          flutter analyze
          flutter test

      - name: Build Android demo
        run: flutter build apk --release

      - name: Upload Android demo
        uses: actions/upload-artifact@v4
        with:
          name: versioned-android-demo
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows demo
        run: flutter build windows --release

      - name: Package Windows demo
        shell: pwsh
        run: >-
          Compress-Archive
          -Path "build/windows/x64/runner/Release/*"
          -DestinationPath "CoinScope-Windows.zip"
          -Force

      - name: Upload Windows demo
        uses: actions/upload-artifact@v4
        with:
          name: versioned-windows-demo
          path: CoinScope-Windows.zip
          if-no-files-found: error

  publish:
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download Android demo
        uses: actions/download-artifact@v4
        with:
          name: versioned-android-demo
          path: release/android

      - name: Download Windows demo
        uses: actions/download-artifact@v4
        with:
          name: versioned-windows-demo
          path: release/windows

      - name: Prepare release assets
        run: |
          cp release/android/app-release.apk CoinScope-Android.apk
          cp release/windows/CoinScope-Windows.zip CoinScope-Windows.zip

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" CoinScope-Android.apk CoinScope-Windows.zip
          --target "$GITHUB_SHA"
          --title "CoinScope $RELEASE_TAG"
          --generate-notes
