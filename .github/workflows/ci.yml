name: Mobile CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Android demo
        run: flutter build apk --release

      - name: Upload Android demo
        uses: actions/upload-artifact@v4
        with:
          name: coinscope-android-demo
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish rolling Android demo
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk CoinScope-Android.apk
          if gh release view android-demo >/dev/null 2>&1; then
            gh release upload android-demo CoinScope-Android.apk --clobber
          else
            gh release create android-demo CoinScope-Android.apk \
              --target "$GITHUB_SHA" \
              --title "CoinScope Android Demo" \
              --notes "Recruiter-ready Android build generated from the verified main branch."
          fi
